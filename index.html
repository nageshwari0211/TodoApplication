<html>

<head>
    <link rel="stylesheet" href="hettp://stackpath.bootstrapcdn.com/bootstrap/4.5.2/css/bootstrap.min.css" />
    <link rel="stylesheet" href="index.css" />
</head>

<body>
    <div class="todos-bg-container">
        <div class="container">
            <div class="row">
                <div class="col-12">
                    <h1 class="todos-heading">TODO APPLICATION</h1>
                    <h1 class="create-task-heading">Create
                        <span class="create-task-heading-subpart">Tasks</span>
                    </h1>
                    <input type="text" id="todoUserInput" class="todo-user-input"
                        placeholder="What needs to be done?" />
                    <button class="button" id="addTodoButton">Add</button>
                    <h1 class="todo-Item-heading">My
                        <span class="todo-items-heading-subpart">Tasks</span>
                    </h1>
                    <ul class="todo-items-container" id="todoItemsContainer"></ul>
                    <button class="button" id="saveTodoButton">Save</button>
                </div>
            </div>
        </div>
    </div>
    <script src="index.js"></script>
</body>

</html>
